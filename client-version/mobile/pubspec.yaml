name: relay_agent
description: "Relay telecom field operations demo application."
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  sqflite: ^2.4.2+1
  synchronized: ^3.4.0+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dmsans.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope.ttf
