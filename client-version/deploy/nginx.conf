server {
    listen 80;
    server_name relay-client.187-127-162-233.sslip.io;
    location /.well-known/acme-challenge/ { root /opt/relay-client/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name relay-client.187-127-162-233.sslip.io;
    ssl_certificate /etc/letsencrypt/live/relay-client.187-127-162-233.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay-client.187-127-162-233.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/relay-client/web/dist;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /downloads/ {
        alias /opt/relay-client/downloads/;
        autoindex off;
        types { application/vnd.android.package-archive apk; }
    }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
