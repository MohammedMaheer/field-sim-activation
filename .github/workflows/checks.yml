name: Proposal edition checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client-version/web/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: client-version/backend
      - run: python -m pytest -q
        working-directory: client-version/backend
      - run: python -m ruff check app tests
        working-directory: client-version/backend
      - run: npm ci && npm run build
        working-directory: client-version/web
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client-version/mobile
      - run: flutter analyze
        working-directory: client-version/mobile
      - run: flutter test
        working-directory: client-version/mobile
